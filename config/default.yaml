# Risk2Relief Default Application Configuration

app:
  name: "Risk2Relief Building-Management Digital-Twin"
  version: "0.1.0"
  environment: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

database:
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  echo_sql: false

redis:
  socket_timeout: 5
  socket_connect_timeout: 5
  health_check_interval: 30

simulation:
  mode: "in-silico-only"
  engine: "structural_stress_v1"
  tick_rate_hz: 10
  max_stress_tolerance_mpa: 450.0
  critical_deflection_threshold_mm: 15.0
  hardware_actuators_enabled: false
